<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forgot Password | HerdTrace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <style>
    body {
      font-family: "Inter", sans-serif;
      background-color: #fafee6;
    }
    h1, h2, h3 {
      font-family: "Plus Jakarta Sans", sans-serif;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col bg-[#FAFEE6]">
  <!-- Header -->
  <header class="bg-[#2B5669] text-white fixed w-full z-50 shadow-lg">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center space-x-4">
        <img src="images/logo.png" alt="HerdTrace Logo" class="h-14 md:h-16" />
        <span class="text-3xl md:text-4xl font-semibold">HerdTrace</span>
      </a>
      <nav class="hidden md:flex space-x-8 items-center">
        <a href="index.html" class="hover:text-yellow-300 font-medium">Home</a>
        <a href="login.html" class="hover:text-yellow-300 font-medium">Login</a>
        <a href="support.html" class="hover:text-yellow-300 font-medium">Support</a>
      </nav>
    </div>
  </header>

  <!-- original: using simple alerts -->

  <!-- Forgot Password Form -->
  <main class="flex-1 pt-32 pb-16 flex justify-center items-center">
    <div class="bg-white p-10 rounded-xl shadow-lg w-full max-w-md">
      <h2 class="text-2xl font-bold text-center text-[#2B5669] mb-6">Forgot Your Password?</h2>
      <p class="text-center text-gray-600 mb-4">Enter your email address and we’ll send you a link to reset your password.</p>
      <form id="forgotPasswordForm" class="space-y-4">
        <div>
          <label for="email" class="block mb-1 font-medium">Email Address</label>
          <input type="email" id="email" name="email" class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring focus:border-[#2B5669]" required>
        </div>
        <div class="text-center">
          <button type="submit" class="bg-[#2B5669] hover:bg-yellow-300 text-white hover:text-[#2B5669] px-6 py-2 rounded-full font-semibold transition-colors duration-200">
            Send Reset Link
          </button>
        </div>
      </form>
      <div class="text-center mt-4 text-sm">
        <a href="login.html" class="text-[#2B5669] font-medium hover:text-yellow-300 transition-colors duration-200">Back to Login</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-[#2B5669] text-white py-10 mt-auto">
    <div class="container mx-auto px-4 text-center">
      <div class="mb-4">
        <a href="https://www.facebook.com/profile.php?id=61573172663345" target="_blank" class="mx-3 hover:text-yellow-300"><i class="fab fa-facebook-f"></i></a>
        <a href="https://www.linkedin.com/company/herdtrace/posts/?feedView=all" target="_blank" class="mx-3 hover:text-yellow-300"><i class="fab fa-linkedin-in"></i></a>
        <a href="mailto:info@herdtrace.co.za" class="mx-3 hover:text-yellow-300"><i class="fas fa-envelope"></i></a>
      </div>
      <p>&copy; 2025 HerdTrace. All rights reserved.</p>
    </div>
  </footer>

  <script>
    document.getElementById("forgotPasswordForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      if (!email) {
        alert("Please enter your email.");
        return;
      }

      const formData = new FormData();
      formData.append("email", email);

      try {
        const response = await fetch("/HerdTrace/forgot_password.php", {
          method: "POST",
          body: formData
        });
        const result = await response.json();
        if (result.success) {
          alert("Reset link sent to your email.");
        } else {
          alert(result.error || "Something went wrong.");
        }
      } catch (error) {
        alert("Could not connect to server.");
        console.error(error);
      }
    });
  </script>
</body>
</html>
