<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Password | HerdTrace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Plus+Jakarta+Sans:wght@700&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <style>
    body {
      font-family: "Inter", sans-serif;
      background-color: #fafee6;
    }
    h1, h2, h3 {
      font-family: "Plus Jakarta Sans", sans-serif;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col bg-[#FAFEE6]">
  <!-- Header -->
  <header class="bg-[#2B5669] text-white fixed w-full z-50 shadow-lg">
    <div class="container mx-auto px-4 py-3 flex justify-between items-center">
      <a href="index.html" class="flex items-center space-x-4">
        <img src="images/logo.png" alt="HerdTrace Logo" class="h-14 md:h-16" />
        <span class="text-3xl md:text-4xl font-semibold">HerdTrace</span>
      </a>
      <nav class="hidden md:flex space-x-8 items-center">
        <a href="index.html" class="hover:text-yellow-300 font-medium">Home</a>
        <a href="login.html" class="hover:text-yellow-300 font-medium">Login</a>
        <a href="support.html" class="hover:text-yellow-300 font-medium">Support</a>
      </nav>
    </div>
  </header>

  <!-- Reset Password Form -->
  <main class="flex-1 pt-32 pb-16 flex justify-center items-center">
    <div class="bg-white p-10 rounded-xl shadow-lg w-full max-w-md">
      <h2 class="text-2xl font-bold text-center text-[#2B5669] mb-6">Reset Your Password</h2>
      <form id="resetPasswordForm" class="space-y-4">
        <input type="hidden" id="token" name="token" value="" />
        <div>
          <label for="newPassword" class="block mb-1 font-medium">New Password</label>
          <input type="password" id="newPassword" name="newPassword" class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring focus:border-[#2B5669]" required>
        </div>
        <div>
          <label for="confirmPassword" class="block mb-1 font-medium">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" class="w-full px-4 py-2 border border-gray-300 rounded focus:outline-none focus:ring focus:border-[#2B5669]" required>
        </div>
        <div class="text-center">
          <button type="submit" class="bg-[#2B5669] hover:bg-yellow-300 text-white hover:text-[#2B5669] px-6 py-2 rounded-full font-semibold transition-colors duration-200">
            Reset Password
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-[#2B5669] text-white py-10 mt-auto">
    <div class="container mx-auto px-4 text-center">
      <div class="mb-4">
        <a href="https://www.facebook.com/profile.php?id=61573172663345" target="_blank" class="mx-3 hover:text-yellow-300"><i class="fab fa-facebook-f"></i></a>
        <a href="https://www.linkedin.com/company/herdtrace/posts/?feedView=all" target="_blank" class="mx-3 hover:text-yellow-300"><i class="fab fa-linkedin-in"></i></a>
        <a href="mailto:info@herdtrace.co.za" class="mx-3 hover:text-yellow-300"><i class="fas fa-envelope"></i></a>
      </div>
      <p>&copy; 2025 HerdTrace. All rights reserved.</p>
    </div>
  </footer>

  <script>
    // Extract token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    document.getElementById('token').value = token;

    document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const newPass = this.newPassword.value.trim();
      const confirm = this.confirmPassword.value.trim();
      const token = this.token.value;

      if (!newPass || !confirm) {
        alert("Please fill in both fields.");
        return;
      }
      if (newPass !== confirm) {
        alert("Passwords do not match.");
        return;
      }

      const formData = new FormData();
      formData.append("token", token);
      formData.append("newPassword", newPass);

      try {
        const response = await fetch("/HerdTrace/reset_password.php", {
          method: "POST",
          body: formData
        });
        const result = await response.json();
        if (result.success) {
          alert("Password reset successful!");
          window.location.href = "login.html";
        } else {
          alert(result.error || "Reset failed.");
        }
      } catch (error) {
        alert("Server error. Please try again.");
        console.error(error);
      }
    });
  </script>
</body>
</html>
