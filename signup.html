  <!-- Sign Up Form -->
  <main class="flex-1 pt-32 pb-16 flex justify-center items-center">
    <div class="bg-white p-10 rounded-xl shadow-lg w-full max-w-md">
      <h2 class="text-2xl font-bold text-center text-[#2B5669] mb-6">Create an Account</h2>
      <!-- 👇 Updated form inside your existing <form id="signUpForm" ...> -->
        <form id="signUpForm" class="space-y-4" method="POST" action="signup.php">
          <div>
            <label for="firstName" class="block mb-1 font-medium">Name</label>
            <input type="text" id="firstName" name="firstName" class="w-full px-4 py-2 border border-gray-300 rounded" required>
          </div>
          <div>
            <label for="lastName" class="block mb-1 font-medium">Surname</label>
            <input type="text" id="lastName" name="lastName" class="w-full px-4 py-2 border border-gray-300 rounded" required>
          </div>
          <div>
            <label for="idNumber" class="block mb-1 font-medium">ID Number</label>
            <input type="text" id="idNumber" name="idNumber" class="w-full px-4 py-2 border border-gray-300 rounded" required>
          </div>
          <div>
            <label for="email" class="block mb-1 font-medium">Email Address</label>
            <input type="email" id="email" name="email" class="w-full px-4 py-2 border border-gray-300 rounded" required>
          </div>
          <div>
            <label for="mobile" class="block mb-1 font-medium">Mobile Number</label>
            <input type="tel" id="mobile" name="mobile" class="w-full px-4 py-2 border border-gray-300 rounded" required>
          </div>
          <div>
            <label for="password" class="block mb-1 font-medium">Create Password</label>
            <input type="password" id="password" name="password" class="w-full px-4 py-2 border border-gray-300 rounded" required>
          </div>
          <div>
            <label for="confirm" class="block mb-1 font-medium">Confirm Password</label>
            <input type="password" id="confirm" class="w-full px-4 py-2 border border-gray-300 rounded" required>
          </div>
          <div class="text-center">
            <button type="submit" class="bg-[#2B5669] hover:bg-yellow-300 text-white hover:text-[#2B5669] px-6 py-2 rounded-full font-semibold transition-colors duration-200">Sign Up</button>
          </div>
        </form>

      <div class="text-center mt-4 text-sm">

  <!-- Script -->
  <script>
  document.getElementById("signUpForm").addEventListener("submit", async function (e) {
    e.preventDefault();

    const firstName = document.getElementById("firstName").value.trim();
    const lastName = document.getElementById("lastName").value.trim();
    const idNumber = document.getElementById("idNumber").value.trim();
    const email = document.getElementById("email").value.trim();
    const mobile = document.getElementById("mobile").value.trim();
    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm").value;

    if (!firstName || !lastName || !idNumber || !email || !mobile || !password || !confirm) {
      alert("Please fill in all the fields.");
      return;
    }

    if (password.length < 6) {
      alert("Password should be at least 6 characters long.");
      return;
    }

    if (password !== confirm) {
      alert("Passwords do not match!");
      return;
    }

    // Prepare form data
    const formData = new FormData();
    formData.append("firstName", firstName);
    formData.append("lastName", lastName);
    formData.append("idNumber", idNumber);
    formData.append("email", email);
    formData.append("mobile", mobile);
    formData.append("password", password);

    try {
      const response = await fetch("http://localhost/HerdTrace/signup.php", {
        method: "POST",
        body: formData
      });
      const text = await response.text();
      let result;
      try {
        result = JSON.parse(text);
      } catch (err) {
        alert("Server error: Invalid response. Check console.");
        console.error("Raw server response:", text);
        return;
      }

      if (result.success) {
        alert(result.success);
        window.location.href = "login.html";
      } else {
        alert(result.error || "Registration failed.");
      }
    } catch (error) {
      alert("Could not connect to server. Please try again later.");
      console.error(error);
    }
  });
</script>
